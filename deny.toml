[licenses]
confidence-threshold = 0.95
allow = [
    "AGPL-3.0-or-later", # Workspace engine license.
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0", # Root certificate data; permits redistribution.
]

[bans]
multiple-versions = "deny"
# Wildcard-version bans are not enabled: publishable workspace crates currently
# use versionless local path dependencies. This gate bans new duplicate lines;
# registry-source and advisory checks remain independent of these exceptions.

