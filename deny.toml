# Run with cargo-deny 0.20.2; inspect the entire workspace and all target platforms.
[graph]
all-features = true

[advisories]
yanked = "deny"
unmaintained = "all"
unused-ignored-advisory = "deny"
# Baseline exceptions require review; new advisory IDs and yanks still fail.
ignore = [
    # rsa@0.9.10: Marvin Attack: potential key recovery through timing sidechannels
    # No safe upgrade is available!
    # No fixed release is available. Software-backend RSA private-key operations are not
    # constant-time; production RSA keys belong on PKCS#11.
    { id = "RUSTSEC-2023-0071", reason = "No fixed release is available. Software-backend RSA private-key operations are not constant-time; production RSA keys belong on PKCS#11." },
    # rustls-pemfile@2.2.0: rustls-pemfile is unmaintained
    # No safe upgrade is available!
    # Unmaintained, with no open vulnerability. Replace rustls-pemfile after 0.5.0.
    { id = "RUSTSEC-2025-0134", reason = "Unmaintained, with no open vulnerability. Replace rustls-pemfile after 0.5.0." },
    # unsafe-libyaml@0.2.11: unsafe-libyaml is unmaintained
    # No safe upgrade is available!
    # Unmaintained, with no open vulnerability. Replace unsafe-libyaml after 0.5.0.
    { id = "RUSTSEC-2024-0449", reason = "Unmaintained, with no open vulnerability. Replace unsafe-libyaml after 0.5.0." },
]

[licenses]
confidence-threshold = 0.95
allow = [
    "AGPL-3.0-or-later", # Workspace engine license.
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0", # Root certificate data; permits redistribution.
]

[bans]
multiple-versions = "deny"
# Wildcard-version bans are not enabled: publishable workspace crates currently
# use versionless local path dependencies. This gate bans new duplicate lines;
# registry-source and advisory checks remain independent of these exceptions.

# Only the older locked versions are exempt; new duplicate versions still fail.
skip = [
    # keyrack-core, rsa@0.9 and x509-cert@0.2 require der@0.7; EC 0.14 uses der@0.8.
    { name = "der", version = "=0.7.10" },
    # curve25519-dalek@4.1 requires 0.2; p384@0.14 requires 0.3.
    { name = "fiat-crypto", version = "=0.2.9" },
    # der@0.7 and rsa@0.9 require 0.7; EC der@0.8 requires 1.0.
    { name = "pem-rfc7468", version = "=0.7.0" },
    # rsa@0.9 and ed25519@2.2 require 0.10; elliptic-curve@0.14 requires 0.11.
    { name = "pkcs8", version = "=0.10.2" },
    # rand@0.9 requires 0.9; EC 0.14 and getrandom-ec require 0.10.
    { name = "rand_core", version = "=0.9.5" },
    # rsa@0.9 and ed25519@2.2 require 2.2; ecdsa@0.17 requires 3.0.
    { name = "signature", version = "=2.2.0" },
    # rsa@0.9 and x509-cert@0.2 require 0.7; EC 0.14 requires 0.8.
    { name = "spki", version = "=0.7.3" },
    # tokio-websockets@0.10.1 via async-nats@0.47 requires this compatibility
    # package; it re-exports webpki-roots@1.0.11, with no independent root store.
    { name = "webpki-roots", version = "=0.26.11" },
    # arrayvec@0.5.2 is required by pretty@0.12.5.
    { name = "arrayvec", version = "=0.5.2" },
    # axum@0.7.9 is required by keyrack-cedar-pdp@0.5.0, keyrack-service@0.5.0, tonic@0.12.3.
    { name = "axum", version = "=0.7.9" },
    # axum-core@0.4.5 is required by axum@0.7.9.
    { name = "axum-core", version = "=0.4.5" },
    # block-buffer@0.10.4 is required by digest@0.10.7.
    { name = "block-buffer", version = "=0.10.4" },
    # const-oid@0.9.6 is required by der@0.7.10, digest@0.10.7, rsa@0.9.10, x509-cert@0.2.5.
    { name = "const-oid", version = "=0.9.6" },
    # cpufeatures@0.2.17 is required by aes@0.8.4, curve25519-dalek@4.1.3, keccak@0.1.6, polyval@0.6.2, sha1@0.10.6, sha2@0.10.9.
    { name = "cpufeatures", version = "=0.2.17" },
    # crypto-common@0.1.6 is required by aead@0.5.2, cipher@0.4.4, digest@0.10.7, universal-hash@0.5.1.
    { name = "crypto-common", version = "=0.1.6" },
    # digest@0.10.7 is required by curve25519-dalek@4.1.3, hmac@0.12.1, md-5@0.10.6, rsa@0.9.10, sha1@0.10.6, sha2@0.10.9, sha3@0.10.9, signature@2.2.0.
    { name = "digest", version = "=0.10.7" },
    # getrandom@0.2.17 is required by keyrack-wasm@0.5.0, nkeys@0.4.5, rand_core@0.6.4, ring@0.17.14.
    { name = "getrandom", version = "=0.2.17" },
    # getrandom@0.3.4 is required by jobserver@0.1.34, rand_core@0.9.5.
    { name = "getrandom", version = "=0.3.4" },
    # hashbrown@0.12.3 is required by indexmap@1.9.3.
    { name = "hashbrown", version = "=0.12.3" },
    # hashbrown@0.14.5 is required by hashlink@0.9.1.
    { name = "hashbrown", version = "=0.14.5" },
    # hashbrown@0.15.5 is required by hashlink@0.10.0, metrics-util@0.19.1, sqlx-core@0.8.6.
    { name = "hashbrown", version = "=0.15.5" },
    # hashlink@0.9.1 is required by rusqlite@0.32.1.
    { name = "hashlink", version = "=0.9.1" },
    # hmac@0.12.1 is required by hkdf@0.12.4, keyrack-core@0.5.0, rfc6979@0.4.0, sqlx-postgres@0.8.6.
    { name = "hmac", version = "=0.12.1" },
    # http@0.2.12 is required by aws-sdk-sso@1.98.0, aws-sdk-ssooidc@1.100.0, aws-sdk-sts@1.103.0, aws-sigv4@1.4.3, aws-smithy-runtime@1.11.1, aws-smithy-runtime-api@1.12.0, aws-smithy-types@1.4.7, http-body@0.4.6.
    { name = "http", version = "=0.2.12" },
    # http-body@0.4.6 is required by aws-smithy-runtime@1.11.1, aws-smithy-types@1.4.7.
    { name = "http-body", version = "=0.4.6" },
    # indexmap@1.9.3 is required by tower@0.4.13.
    { name = "indexmap", version = "=1.9.3" },
    # matchit@0.7.3 is required by axum@0.7.9.
    { name = "matchit", version = "=0.7.3" },
    # r-efi@5.3.0 is required by getrandom@0.3.4.
    { name = "r-efi", version = "=5.3.0" },
    # rand@0.8.6 is required by async-nats@0.47.0, keyrack-core@0.5.0, keyrack-crypto-worker@0.1.0, keyrack-service@0.5.0, keyrack-vault@0.5.0, nkeys@0.4.5, nuid@0.5.0, num-bigint-dig@0.8.6, sqlx-postgres@0.8.6, tokio-websockets@0.10.1, tower@0.4.13.
    { name = "rand", version = "=0.8.6" },
    # rand_chacha@0.3.1 is required by rand@0.8.6.
    { name = "rand_chacha", version = "=0.3.1" },
    # rand_core@0.6.4 is required by crypto-common@0.1.6, ed25519-dalek@2.2.0, rand@0.8.6, rand_chacha@0.3.1, rsa@0.9.10, signatory@0.27.1, signature@2.2.0.
    { name = "rand_core", version = "=0.6.4" },
    # redox_syscall@0.5.18 is required by parking_lot_core@0.9.12.
    { name = "redox_syscall", version = "=0.5.18" },
    # sha2@0.10.9 is required by ed25519-dalek@2.2.0, keyrack-core@0.5.0, keyrack-crypto-worker@0.1.0, keyrack-surface-contract@0.1.0, keyrack-vault@0.5.0, rsa@0.9.10, sqlx-core@0.8.6, sqlx-macros-core@0.8.6, sqlx-postgres@0.8.6.
    { name = "sha2", version = "=0.10.9" },
    # socket2@0.5.10 is required by tonic@0.12.3, tonic@0.13.1.
    { name = "socket2", version = "=0.5.10" },
    # thiserror@1.0.69 is required by async-nats@0.47.0, metrics-exporter-prometheus@0.16.2.
    { name = "thiserror", version = "=1.0.69" },
    # thiserror-impl@1.0.69 is required by thiserror@1.0.69.
    { name = "thiserror-impl", version = "=1.0.69" },
    # tonic@0.12.3 is required by keyrack-cli@0.5.0, keyrack-e2e@0.5.0, keyrack-service@0.5.0, keyrack-test-support@0.5.0.
    { name = "tonic", version = "=0.12.3" },
    # tower@0.4.13 is required by tonic@0.12.3.
    { name = "tower", version = "=0.4.13" },
    # unicode-width@0.1.14 is required by miette@7.6.0.
    { name = "unicode-width", version = "=0.1.14" },
    # windows-sys@0.48.0 is required by etcetera@0.8.0.
    { name = "windows-sys", version = "=0.48.0" },
    # windows-sys@0.52.0 is required by notify@7.0.0, ring@0.17.14, socket2@0.5.10.
    { name = "windows-sys", version = "=0.52.0" },
    # windows-targets@0.48.5 is required by windows-sys@0.48.0.
    { name = "windows-targets", version = "=0.48.5" },
    # windows_aarch64_gnullvm@0.48.5 is required by windows-targets@0.48.5.
    { name = "windows_aarch64_gnullvm", version = "=0.48.5" },
    # windows_aarch64_msvc@0.48.5 is required by windows-targets@0.48.5.
    { name = "windows_aarch64_msvc", version = "=0.48.5" },
    # windows_i686_gnu@0.48.5 is required by windows-targets@0.48.5.
    { name = "windows_i686_gnu", version = "=0.48.5" },
    # windows_i686_msvc@0.48.5 is required by windows-targets@0.48.5.
    { name = "windows_i686_msvc", version = "=0.48.5" },
    # windows_x86_64_gnu@0.48.5 is required by windows-targets@0.48.5.
    { name = "windows_x86_64_gnu", version = "=0.48.5" },
    # windows_x86_64_gnullvm@0.48.5 is required by windows-targets@0.48.5.
    { name = "windows_x86_64_gnullvm", version = "=0.48.5" },
    # windows_x86_64_msvc@0.48.5 is required by windows-targets@0.48.5.
    { name = "windows_x86_64_msvc", version = "=0.48.5" },
    # wit-bindgen@0.51.0 is required by wasip3@0.4.0+wasi-0.3.0-rc-2026-01-06.
    { name = "wit-bindgen", version = "=0.51.0" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
