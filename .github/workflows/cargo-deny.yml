name: Dependency policy
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  cargo-deny:
    name: Cargo deny
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install pinned policy checker
        run: cargo install cargo-deny --version 0.20.2 --locked
      - name: Check policy and qualify refusals
        run: python3 scripts/test-dependency-policy-controls.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-policy-controls
          path: target/proofs/dependency-policy/
          if-no-files-found: error
