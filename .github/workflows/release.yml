name: Release

# On a version tag, run the full E2E demo suite FIRST, then PROMOTE the image
# that docker.yml already built for this commit (published as :sha-<short> on
# the main push) to the release version tags. No rebuild: the released image is
# byte-identical to what E2E validated. A failed E2E blocks the promote.
# The SoftHSM variant additionally requires softhsm-profile.yml to succeed for
# this exact main commit; its recorded multi-arch digest is promoted separately.
on:
  push:
    tags: ["v*"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: keyrack-io/keyrack-service

jobs:
  e2e:
    name: E2E gate
    uses: ./.github/workflows/e2e.yml

  publish:
    name: Promote image to release tags
    needs: e2e
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract release metadata (tags)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # latest=auto tags :latest only for the highest NON-prerelease semver,
          # so prereleases (e.g. 0.2.0-beta.2) never become :latest.
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # docker.yml built this exact commit on the main push and published it as
      # :sha-<short> (metadata-action type=sha => 7-char short sha).
      - name: Resolve source image
        id: src
        run: echo "ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-$(echo ${GITHUB_SHA} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Wait for source image
        run: |
          for i in $(seq 1 60); do
            if docker buildx imagetools inspect "${{ steps.src.outputs.ref }}" >/dev/null 2>&1; then
              echo "found ${{ steps.src.outputs.ref }}"; exit 0
            fi
            echo "waiting for ${{ steps.src.outputs.ref }} ($i/60)"; sleep 30
          done
          echo "source image ${{ steps.src.outputs.ref }} never appeared"; exit 1

      - name: Promote to release tags
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            "${{ steps.src.outputs.ref }}"

      - name: Inspect
        run: docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}

  publish-softhsm:
    name: Promote tested SoftHSM image to release tags
    needs: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      packages: write
    env:
      SOFTHSM_IMAGE: ghcr.io/keyrack-io/keyrack-service-softhsm
    steps:
      # A short-SHA tag alone is not evidence that either native architecture
      # passed its image proof. Require the completed main workflow and take
      # the immutable manifest digest from that exact run's source artifact.
      - name: Wait for tested main source workflow
        id: tested
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.parse
          import urllib.request

          sha = os.environ["GITHUB_SHA"]
          query = urllib.parse.urlencode({"branch": "main", "event": "push", "head_sha": sha, "per_page": 100})
          url = (f'{os.environ["GITHUB_API_URL"]}/repos/{os.environ["GITHUB_REPOSITORY"]}'
                 f'/actions/workflows/softhsm-profile.yml/runs?{query}')
          request = urllib.request.Request(url, headers={
              "Authorization": f'Bearer {os.environ["GH_TOKEN"]}',
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          })
          for attempt in range(60):
              with urllib.request.urlopen(request, timeout=30) as response:
                  runs = json.load(response)["workflow_runs"]
              runs = [run for run in runs if run["head_sha"] == sha
                      and run["head_branch"] == "main" and run["event"] == "push"]
              if runs:
                  latest = max(runs, key=lambda run: int(run["run_number"]))
                  if latest["status"] == "completed":
                      if latest["conclusion"] != "success":
                          raise SystemExit("SoftHSM source workflow did not succeed; release promotion refused")
                      with open(os.environ["GITHUB_OUTPUT"], "a") as output:
                          output.write(f'run_id={int(latest["id"])}\n')
                          output.write(f'run_attempt={int(latest["run_attempt"])}\n')
                      break
              print(f"Waiting for the exact-commit SoftHSM main proof ({attempt + 1}/60)", flush=True)
              time.sleep(30)
          else:
              raise SystemExit("No successful SoftHSM main proof for release commit; promotion refused")
          PY

      - name: Download tested source artifact
        uses: actions/download-artifact@v7
        with:
          name: softhsm-release-source
          path: ${{ runner.temp }}/softhsm-release-source
          github-token: ${{ github.token }}
          run-id: ${{ steps.tested.outputs.run_id }}

      - name: Validate immutable tested source
        id: source
        env:
          SOURCE_FILE: ${{ runner.temp }}/softhsm-release-source/release-source.json
          TESTED_RUN_ID: ${{ steps.tested.outputs.run_id }}
          TESTED_RUN_ATTEMPT: ${{ steps.tested.outputs.run_attempt }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re

          with open(os.environ["SOURCE_FILE"]) as source:
              value = json.load(source)
          expected = {
              "schema": 1,
              "commit": os.environ["GITHUB_SHA"],
              "image": os.environ["SOFTHSM_IMAGE"],
              "platforms": ["linux/amd64", "linux/arm64"],
              "run_id": os.environ["TESTED_RUN_ID"],
              "run_attempt": os.environ["TESTED_RUN_ATTEMPT"],
          }
          if not isinstance(value, dict) or set(value) != set(expected) | {"digest"}:
              raise SystemExit("Invalid SoftHSM source artifact schema")
          if any(type(value[key]) is not type(wanted) or value[key] != wanted for key, wanted in expected.items()):
              raise SystemExit("SoftHSM source artifact does not match the tested release commit and run")
          digest = value["digest"]
          if not isinstance(digest, str) or not re.fullmatch(r"sha256:[0-9a-f]{64}", digest):
              raise SystemExit("SoftHSM source artifact has no valid immutable manifest digest")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f'ref={value["image"]}@{digest}\n')
          PY

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify actual source manifest platforms
        env:
          SOURCE_REF: ${{ steps.source.outputs.ref }}
        run: |
          docker buildx imagetools inspect --raw "$SOURCE_REF" > "$RUNNER_TEMP/softhsm-source-manifest.json"
          python3 - <<'PY'
          import json
          import os

          with open(os.path.join(os.environ["RUNNER_TEMP"], "softhsm-source-manifest.json")) as source:
              manifest = json.load(source)
          if manifest.get("mediaType") not in {
              "application/vnd.oci.image.index.v1+json",
              "application/vnd.docker.distribution.manifest.list.v2+json",
          }:
              raise SystemExit("SoftHSM source is not a multi-platform manifest")
          platforms = []
          for descriptor in manifest.get("manifests", []):
              platform = descriptor.get("platform", {})
              pair = (platform.get("os"), platform.get("architecture"))
              if pair == ("unknown", "unknown") and descriptor.get("annotations", {}).get(
                  "vnd.docker.reference.type"
              ) == "attestation-manifest":
                  continue
              platforms.append(pair)
          if sorted(platforms) != [("linux", "amd64"), ("linux", "arm64")]:
              raise SystemExit("SoftHSM source must contain exactly one tested amd64 and arm64 image")
          PY

      - name: Extract SoftHSM release tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.SOFTHSM_IMAGE }}
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Promote tested SoftHSM digest without rebuilding
        env:
          SOURCE_REF: ${{ steps.source.outputs.ref }}
        run: |
          mapfile -t tags < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          test "${#tags[@]}" -gt 0
          args=()
          for tag in "${tags[@]}"; do args+=(-t "$tag"); done
          docker buildx imagetools create "${args[@]}" "$SOURCE_REF"

      - name: Inspect promoted SoftHSM release
        run: docker buildx imagetools inspect "${{ env.SOFTHSM_IMAGE }}:${{ steps.meta.outputs.version }}"
