name: REST and gRPC surface parity
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'feat/**', 'fix/**', 'handback/**']
permissions:
  contents: read
jobs:
  parity:
    name: Explicit API surface and generated claim
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Check compiler and AST inventory against the explicit contract
        run: cargo test --locked -p keyrack-surface-contract
      - name: Revert enumeration and claim controls
        run: python3 conformance/api-surface/controls.py --output-dir target/proofs/api-surface
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: api-surface-controls
          path: target/proofs/api-surface/
          if-no-files-found: error
