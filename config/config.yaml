grpc_addr: "0.0.0.0:50051"
rest_addr: "0.0.0.0:8080"
storage:
  type: memory
provider:
  type: software
# Demo only: authorization is disabled outright. `always_allow` must be stated
# explicitly — omitting `pdp:` is a startup error, not a silent allow.
pdp:
  type: always_allow
audit:
  type: stdout
authn:
  type: insecure

# --- Optional configuration below ---

# Key record cache (improves latency, required for HYOK deployments)
# cache:
#   ttl_secs: 300
#   max_capacity: 10000

# Audit tamper evidence is always on: every event carries a BLAKE3
# `previous_hash` link, verifiable with `keyrack audit verify <log>` and no key.
#
# Ed25519 signing adds authenticity on top and is opt-in. Enabling it requires a
# persistent key, otherwise signatures written before a restart can never be
# verified again:
# sign_audit_events: true
# audit_signing_key_path: "/etc/keyrack/keys/audit-signing.key"
#
# Development shortcut — accept a per-startup key instead of a persistent one:
# audit_signing_key_ephemeral: true

# JWT authentication with issuer/audience validation:
# authn:
#   type: jwt
#   jwks_url: "https://auth.example.com/.well-known/jwks.json"
#   issuer: "https://auth.example.com/"
#   audience: "keyrack"
#   claims_namespace: "https://keyrack.io/v1"

# Chain authenticator (first match wins):
# authn:
#   type: chain
#   authenticators:
#     - type: jwt
#       jwks_url: "https://auth.example.com/.well-known/jwks.json"
#     - type: forwarded_identity
#     - type: bootstrap_token
#       max_age_secs: 300

# mTLS-bound delegated identity (production service-to-service profile):
# tls:
#   server_cert: /etc/keyrack/tls/server.crt
#   server_key: /etc/keyrack/tls/server.key
#   ca_cert: /etc/keyrack/tls/delegator-ca.pem
# authn:
#   type: mtls_bound_forwarded_identity
#   # Must contain exactly the same PEM material as tls.ca_cert.
#   trusted_ca_cert_path: /etc/keyrack/tls/delegator-ca.pem
#   # At least one exact workload pin is mandatory.
#   required_san: spiffe://cluster.local/ns/essentials/sa/essentials
