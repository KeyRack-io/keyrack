[package]
name = "keyrack-pkcs11"
version = "0.5.0"
description = "KeyRack PKCS#11 provider for hardware HSMs"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
softhsm-tests = []
# Unqualified native mechanism/lifecycle tests, never service capability admission.
native-a2-conformance = []

[dependencies]
keyrack-core = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
cryptoki = "0.12"
uuid = { workspace = true }
zeroize = "1"
sha2 = "0.10"
blake3 = "1"

[dev-dependencies]
aes = "0.8"
aes-kw = "0.2"
keyrack-test-support = { workspace = true }
keyrack-sqlite = { workspace = true }

[lints]
workspace = true
