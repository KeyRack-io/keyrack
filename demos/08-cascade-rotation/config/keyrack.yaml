grpc_addr: "0.0.0.0:50051"
rest_addr: "0.0.0.0:8080"

storage:
  type: sqlite
  path: /data/keyrack.db

provider:
  type: software

# Creating a key with a parent wraps that key's material under the parent, so
# the provider has to be activated for it. This mechanism is software AES-GCM:
# parent, envelope and unwrapped child all live in this process's memory, so
# the hierarchy below is shape, not custody. A backend that contains keys would
# name its own mechanism here.
wrapping:
  - provider: default
    mechanism: software:aes-256-gcm:v1
    security_domain: demo-08-single-process

# DEVELOPMENT ONLY: key material is lost at restart despite persisted metadata.
dev_only_allow_ephemeral_provider_with_persistent_metadata: true

# Demo only: authorization is disabled outright. `always_allow` must be stated
# explicitly — omitting `pdp:` is a startup error, not a silent allow.
pdp:
  type: always_allow

audit:
  type: stdout

# Audit events are BLAKE3 hash-chained regardless of this flag. Signing adds
# Ed25519 authenticity on top; the ephemeral opt-in is a demo-only choice.
sign_audit_events: true
audit_signing_key_ephemeral: true

authn:
  type: insecure

cache:
  max_capacity: 1000
  ttl_secs: 60
