grpc_addr: "0.0.0.0:50051"
rest_addr: "0.0.0.0:8080"

storage:
  type: sqlite
  path: /data/keyrack.db

provider:
  type: software

# Demo only: authorization is disabled outright. `always_allow` must be stated
# explicitly — omitting `pdp:` is a startup error, not a silent allow.
pdp:
  type: always_allow

audit:
  type: stdout

# Audit events are BLAKE3 hash-chained regardless of this flag. Signing adds
# Ed25519 authenticity on top; the ephemeral opt-in is a demo-only choice.
sign_audit_events: true
audit_signing_key_ephemeral: true

authn:
  type: insecure

cache:
  max_capacity: 1000
  ttl_secs: 60
