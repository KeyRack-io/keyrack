[package]
name = "ecdsa-version-compatibility"
version = "0.0.0"
edition = "2021"
publish = false
license = "AGPL-3.0-or-later"

# An isolated test oracle: legacy dependencies never enter the service graph.
[workspace]

[dependencies]
p256-old = { package = "p256", version = "=0.13.2", features = ["ecdsa"] }
p384-old = { package = "p384", version = "=0.13.1", features = ["ecdsa"] }
p256-new = { package = "p256", version = "=0.14.0", features = ["ecdsa"] }
p384-new = { package = "p384", version = "=0.14.0", features = ["ecdsa"] }
sha2 = "0.10"
