[server]
hostname=0.0.0.0
port=5696
certificate_path=CERT_DIR/server.crt
key_path=CERT_DIR/server.key
ca_path=CERT_DIR/ca.crt
# PyKMIP's "Basic" suite offers only legacy ciphers that OpenSSL 3 refuses, so
# the handshake fails with an opaque internal error. TLS1.2 is also the floor
# any modern TLS client will negotiate.
auth_suite=TLS1.2
enable_tls_client_auth=True
logging_level=DEBUG
database_path=/tmp/pykmip.db
